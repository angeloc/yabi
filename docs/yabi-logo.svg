<svg xmlns="http://www.w3.org/2000/svg" width="863" height="392" viewBox="24 4 863 392">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="textshadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="tagshadow" x="-10%" y="-50%" width="120%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- a screen that is booting: Material Blue Grey 900 -->
  <rect x="24" y="4" width="863" height="392" rx="36" fill="#263238"/>

  <g transform="translate(80,60)">
    <!-- tile: Material Teal -->
    <rect width="280" height="280" rx="56" fill="#1de9b6" filter="url(#shadow)"/>

    <!-- the boot progress, as a spinner -->
    <circle cx="140" cy="140" r="72" fill="none" stroke="#455a64" stroke-width="26"/>
    <path d="M140 68 A72 72 0 1 1 68 140" fill="none" stroke="#263238" stroke-width="26" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="410" y="207" font-family="Noto Sans Display, DejaVu Sans, sans-serif"
        font-size="168" font-weight="900" letter-spacing="6" filter="url(#textshadow)">
    <tspan fill="#1de9b6">YA</tspan><tspan fill="#ffffff">BI</tspan>
  </text>
  <text font-family="Noto Sans Mono, DejaVu Sans Mono, monospace"
        font-size="30" fill="#cfd8dc" letter-spacing="1" filter="url(#tagshadow)">
    <tspan x="416" y="267">Yet another bootsplash</tspan>
    <tspan x="416" y="305">implementation</tspan>
  </text>
</svg>
