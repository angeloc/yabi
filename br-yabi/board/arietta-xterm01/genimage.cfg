image boot.vfat {
	vfat {
		files = {
			"zImage",
			"boot.bin"
		}

		file logo.bmp {
			image = "${BR2_EXTERNAL_YABI_PATH}/board/arietta-xterm01/logo.bmp"
		}

		file acme-arietta.dtb {
			image = "at91-ariettag25-xterm01.dtb"
		}
	}

	size = 16M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
